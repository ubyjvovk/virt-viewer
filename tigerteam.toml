# tigerteam project config — the one committed config file (v4).
# Resolution chain: defaults -> ~/.tigerteam.toml -> <root>/tigerteam.toml
# -> curated WORKER_* env -> --set key=value.  NO SECRETS in this file — only names.

test_cmd = "bash build-aux/macos/check.sh"
# verify_cmds = ["bash .tigerteam/scripts/run-tests.sh"]
# staging = false
# quiet_load = 8.0
# debounce_s = 60
artifact_globs = ["build/qa/*.png", "build/qa/*.txt"]
# ui_port = 8383

[workers]
max_concurrent = 6
env_passthrough = ["DEEPINFRA_KEY"]   # names only, never values
# env_passthrough = ["DEEPINFRA_KEY"]   # names only, never values
# engine = "claude"
# model = "glm-5.2"
# base_url = "https://api.z.ai/api/anthropic"
# isolation = "worktree"
# orientation_prefix = true
# image = "tigerteam-agents:base"  # machine-local; consider ~/.tigerteam.toml
# agents_home = "/home/you/.agents-home"  # machine-local; consider ~/.tigerteam.toml
# secrets_dir = "/home/you/.tigerteam-secrets"  # machine-local; consider ~/.tigerteam.toml

# Worker profiles (SPEC §3.3). Uncomment and edit for your fleet:
#
# [worker.grok]
# engine = "grok"
# max_complexity = 2
# image = "tigerteam-agents:runecaster"
# cpus = 3
# memory = "4g"
# ticket_timeout_s = 5400
#
# [worker.opus]
# engine = "claude"
# model = "opus"
# login_auth = true
# max_complexity = 3

[worker.codex]
engine = "codex"
model = "gpt-5.6-sol"
max_complexity = 3
capabilities = ["frontier"]
ticket_timeout_s = 5400
scale = 2

[worker.grok]
engine = "grok"
max_complexity = 3
scale = 2

[worker.ds]
engine = "pi"
max_complexity = 2
model = "deepinfra/deepseek-ai/DeepSeek-V4-Flash-0731"
env_passthrough = ["DEEPINFRA_KEY"]
scale = 3

[worker.opus]
engine = "claude"
model = "opus"
login_auth = true
max_complexity = 3
capabilities = ["frontier", "macbuild"]
scale = 2
# Outside Seatbelt (user-authorised 2026-08-30) so this lane can launch the
# built app / .app bundle against WindowServer, take screenshots, and run
# `open`/`codesign` — things the sandboxed lanes cannot. Reserved for
# `capability: [macbuild]` tickets; other work stays sandboxed.
sandbox_profile = ""
# The claude engine still gates Bash on an allowlist even unsandboxed; the GUI
# verification tickets (T-0005/6/9) need these (T-0005 blocked on it, 2026-08-30).
allowed_tools_extra = [
  "Bash(build/src/remote-viewer:*)", "Bash(build/src/virt-viewer:*)",
  "Bash(./build/src/remote-viewer:*)", "Bash(build-aux/macos/*:*)",
  "Bash(bash build-aux/macos/*:*)", "Bash(bash build/qa/*:*)", "Bash(env:*)",
  "Bash(open:*)", "Bash(osascript:*)", "Bash(screencapture:*)",
  "Bash(pgrep:*)", "Bash(pkill:*)", "Bash(sleep:*)", "Bash(mkdir:*)",
  "Bash(codesign:*)", "Bash(plutil:*)", "Bash(otool:*)", "Bash(hdiutil:*)",
  "Bash(iconutil:*)", "Bash(sips:*)", "Bash(dylibbundler:*)",
  "Bash(install_name_tool:*)", "Bash(meson:*)", "Bash(ninja:*)",
  "Bash(python3:*)", "Bash(ruby:*)", "Bash(brew --prefix:*)", "Bash(log show:*)",
  "Bash(/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister:*)",
  "Bash(du:*)", "Bash(find:*)", "Bash(cp:*)", "Bash(rm -rf build:*)",
]
